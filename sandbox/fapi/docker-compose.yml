services:
  api:
    build: .
    container_name: cctv-fastapi
    ports:
      - "8000:8000"

    volumes:
      - .:/app
      - ./app/secrets/ai-cctv-3ee2d-firebase-adminsdk-fbsvc-d5278cc7b2.json:/run/secrets/firebase-service-account.json:ro

    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account.json

    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload